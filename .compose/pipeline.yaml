---
name: ${M6E_COMPOSE_PROJECT_NAME}
services:
  f5m-i2p-reseed:
    container_name: ${M6E_CONTAINER_INSTANCE}
    image: ${M6E_IMAGE_FULLNAME}
    # Preset: large (2.0c, 4g) — CI build/test container. Bounded so it can't starve the shared host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    networks:
      - dev-network
    environment:
      - LANG
      - TZ
      - F5M_I2P_RESEED_SIGNER=admin@example.com
    volumes:
      - type: tmpfs
        target: /app/data
        tmpfs:
          size: 134217728
networks:
  dev-network:
    name: ${M6E_COMPOSE_PROJECT_NAME}-network
