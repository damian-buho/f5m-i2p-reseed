    uk: Дистрибуція reseed-tools від go-i2p з підтримкою спільноти, зібрана на основі B19/Go. Цей репозиторій містить лише пакування — Dockerfile, скрипти збирання та конфігурацію, усе під ліцензією MIT; оригінальні інструменти reseed-tools отримують під час збирання, і вони зберігають власну ліцензію.
